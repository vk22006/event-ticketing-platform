[package]
name = "eventpro"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["mysql"] }
time = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros", "rust_decimal"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
percent-encoding = "2.3"
bcrypt = "0.17"
rand = "0.8"
subtle = "2.6"
rust_decimal = { version = "1", features = ["serde"] }

[profile.dev]
codegen-units = 1
incremental = false

